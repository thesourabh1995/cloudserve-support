name: tests

# Acceptance criterion A12: the suite runs from one documented command and
# passes. The same command is in the README.
#
# No API key is configured here, deliberately. Every test drives the model
# through an injected transport, so a suite that needs a secret to pass would
# mean a component had quietly become untestable without one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest tests/ -q

      - name: Check no credential is committed
        # The project instructions state that a key found in the repository or
        # its history is a serious finding whether or not it still works.
        run: |
          if git grep -nE '(gsk|sk-or-v1|ghp|sk)_[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "A credential-shaped string is committed."
            exit 1
          fi
          echo "No credential-shaped strings found."
