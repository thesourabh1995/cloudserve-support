<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 450" width="780" height="450" font-family="Helvetica, Arial, sans-serif">
  <style>
    .b1   { fill:#5a5a5a; stroke:#333; stroke-width:1; }
    .b2   { fill:#e8e8e8; stroke:#333; stroke-width:1; }
    .axis { stroke:#333; stroke-width:1.2; }
    .grid { stroke:#e6e6e6; stroke-width:1; }
    .sep  { stroke:#bbb; stroke-width:1; stroke-dasharray:3 3; }
    .t    { font-size:11.5px; fill:#111; }
    .s    { font-size:10px; fill:#555; }
    .gap  { font-size:10.5px; fill:#111; }
    .gapx { font-size:10.5px; fill:#111; font-weight:bold; }
    .d    { font-size:11.5px; fill:#333; font-weight:bold; }
    .val  { font-size:10px; fill:#111; }
    .leg  { font-size:11px; fill:#111; }
  </style>

  <line class="grid" x1="80" y1="50"  x2="700" y2="50"/>
  <line class="grid" x1="80" y1="125" x2="700" y2="125"/>
  <line class="grid" x1="80" y1="200" x2="700" y2="200"/>
  <line class="grid" x1="80" y1="250" x2="700" y2="250"/>
  <line class="axis" x1="80" y1="300" x2="700" y2="300"/>
  <line class="axis" x1="80" y1="50"  x2="80"  y2="300"/>

  <text class="s" x="72" y="54"  text-anchor="end">50%</text>
  <text class="s" x="72" y="129" text-anchor="end">35%</text>
  <text class="s" x="72" y="204" text-anchor="end">20%</text>
  <text class="s" x="72" y="254" text-anchor="end">10%</text>
  <text class="s" x="72" y="304" text-anchor="end">0%</text>

  <rect class="b1" x="95"  y="85"  width="30" height="215"/>
  <rect class="b2" x="127" y="170" width="30" height="130"/>
  <text class="val" x="110" y="79"  text-anchor="middle">43</text>
  <text class="val" x="142" y="164" text-anchor="middle">26</text>
  <text class="t"   x="126" y="318" text-anchor="middle">standard</text>
  <text class="s"   x="126" y="331" text-anchor="middle">n=42</text>
  <text class="gap" x="126" y="347" text-anchor="middle">gap 17</text>

  <rect class="b1" x="185" y="200" width="30" height="100"/>
  <rect class="b2" x="217" y="265" width="30" height="35"/>
  <text class="val" x="200" y="194" text-anchor="middle">20</text>
  <text class="val" x="232" y="259" text-anchor="middle">7</text>
  <text class="t"   x="216" y="318" text-anchor="middle">business</text>
  <text class="s"   x="216" y="331" text-anchor="middle">n=30</text>
  <text class="gap" x="216" y="347" text-anchor="middle">gap 13</text>

  <line class="sep" x1="266" y1="50" x2="266" y2="352"/>
  <text class="d" x="171" y="370" text-anchor="middle">Customer tier</text>

  <rect class="b1" x="285" y="160" width="30" height="140"/>
  <rect class="b2" x="317" y="210" width="30" height="90"/>
  <text class="val" x="300" y="154" text-anchor="middle">28</text>
  <text class="val" x="332" y="204" text-anchor="middle">18</text>
  <text class="t"   x="316" y="318" text-anchor="middle">fluent</text>
  <text class="s"   x="316" y="331" text-anchor="middle">n=61</text>
  <text class="gap" x="316" y="347" text-anchor="middle">gap 10</text>

  <rect class="b1" x="375" y="90"  width="30" height="210"/>
  <rect class="b2" x="407" y="220" width="30" height="80"/>
  <text class="val" x="390" y="84"  text-anchor="middle">42</text>
  <text class="val" x="422" y="214" text-anchor="middle">16</text>
  <text class="t"   x="406" y="318" text-anchor="middle">non-fluent</text>
  <text class="s"   x="406" y="331" text-anchor="middle">n=19</text>
  <text class="gapx" x="406" y="347" text-anchor="middle">gap 26</text>

  <line class="sep" x1="458" y1="50" x2="458" y2="352"/>
  <text class="d" x="361" y="370" text-anchor="middle">Language fluency</text>

  <rect class="b1" x="487" y="165" width="30" height="135"/>
  <rect class="b2" x="519" y="245" width="30" height="55"/>
  <text class="val" x="502" y="159" text-anchor="middle">27</text>
  <text class="val" x="534" y="239" text-anchor="middle">11</text>
  <text class="t"   x="518" y="318" text-anchor="middle">medium</text>
  <text class="s"   x="518" y="331" text-anchor="middle">n=56</text>
  <text class="gap" x="518" y="347" text-anchor="middle">gap 16</text>

  <rect class="b1" x="577" y="75"  width="30" height="225"/>
  <rect class="b2" x="609" y="120" width="30" height="180"/>
  <text class="val" x="592" y="69"  text-anchor="middle">45</text>
  <text class="val" x="624" y="114" text-anchor="middle">36</text>
  <text class="t"   x="608" y="318" text-anchor="middle">short</text>
  <text class="s"   x="608" y="331" text-anchor="middle">n=22</text>
  <text class="gap" x="608" y="347" text-anchor="middle">gap 9</text>

  <text class="d" x="563" y="370" text-anchor="middle">Ticket length</text>

  <rect class="b1" x="95" y="392" width="24" height="11"/>
  <text class="leg" x="127" y="402">share of tickets not answered automatically</text>
  <rect class="b2" x="95" y="412" width="24" height="11"/>
  <text class="leg" x="127" y="422">share the policy says must never be answered automatically</text>
  <text class="s" x="95" y="440">"gap" is the difference between the two. Groups under 15 tickets (enterprise, Latin America, long) are omitted; see Table 9.</text>
</svg>
