<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrowlight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>

  <style>
    .box   { fill:#ffffff; stroke:#333333; stroke-width:1.4; }
    .io    { fill:#f2f2f2; stroke:#555555; stroke-width:1.2; }
    .guard { fill:#ffffff; stroke:#111111; stroke-width:2.4; }
    .store { fill:#fafafa; stroke:#666666; stroke-width:1.2; stroke-dasharray:5 3; }
    .tb    { font-size:13.5px; fill:#111; font-weight:bold; }
    .s     { font-size:10.5px; fill:#555; }
    .lbl   { font-size:10.5px; fill:#333; font-style:italic; }
    .flow  { stroke:#333; stroke-width:1.4; fill:none; marker-end:url(#arrow); }
    .flowl { stroke:#888; stroke-width:1.1; fill:none; marker-end:url(#arrowlight); stroke-dasharray:4 3; }
  </style>

  <rect class="io" x="10" y="150" rx="4" width="112" height="94"/>
  <text class="tb" x="66" y="175" text-anchor="middle">Four channels</text>
  <text class="s"  x="66" y="194" text-anchor="middle">email, chat,</text>
  <text class="s"  x="66" y="210" text-anchor="middle">docs_comment,</text>
  <text class="s"  x="66" y="226" text-anchor="middle">forum</text>

  <rect class="box" x="158" y="158" rx="4" width="112" height="78"/>
  <text class="tb" x="214" y="184" text-anchor="middle">Ingest</text>
  <text class="s"  x="214" y="203" text-anchor="middle">one Ticket shape</text>
  <text class="s"  x="214" y="219" text-anchor="middle">name dropped here</text>

  <rect class="box" x="306" y="158" rx="4" width="112" height="78"/>
  <text class="tb" x="362" y="184" text-anchor="middle">Classify</text>
  <text class="s"  x="362" y="203" text-anchor="middle">intent, urgency,</text>
  <text class="s"  x="362" y="219" text-anchor="middle">confidence (PR-01)</text>

  <rect class="box" x="454" y="158" rx="4" width="112" height="78"/>
  <text class="tb" x="510" y="184" text-anchor="middle">Retrieve</text>
  <text class="s"  x="510" y="203" text-anchor="middle">Chroma, cosine,</text>
  <text class="s"  x="510" y="219" text-anchor="middle">or nothing at all</text>

  <rect class="guard" x="602" y="150" rx="4" width="112" height="94"/>
  <text class="tb" x="658" y="178" text-anchor="middle">Route</text>
  <text class="s"  x="658" y="197" text-anchor="middle">seven rules,</text>
  <text class="s"  x="658" y="213" text-anchor="middle">first match wins,</text>
  <text class="s"  x="658" y="229" text-anchor="middle">a pure function</text>

  <rect class="box" x="602" y="40" rx="4" width="112" height="78"/>
  <text class="tb" x="658" y="66" text-anchor="middle">Generate</text>
  <text class="s"  x="658" y="85" text-anchor="middle">grounded only in</text>
  <text class="s"  x="658" y="101" text-anchor="middle">passages (PR-02)</text>

  <rect class="guard" x="762" y="40" rx="4" width="168" height="78"/>
  <text class="tb" x="846" y="66" text-anchor="middle">Guardrails</text>
  <text class="s"  x="846" y="85" text-anchor="middle">private data, grounding;</text>
  <text class="s"  x="846" y="101" text-anchor="middle">block, never warn</text>

  <rect class="io" x="762" y="150" rx="4" width="168" height="48"/>
  <text class="tb" x="846" y="171" text-anchor="middle">Answer sent</text>
  <text class="s"  x="846" y="188" text-anchor="middle">with resolving citations</text>

  <rect class="io" x="762" y="222" rx="4" width="168" height="64"/>
  <text class="tb" x="846" y="243" text-anchor="middle">Human queue</text>
  <text class="s"  x="846" y="259" text-anchor="middle">classification, sources,</text>
  <text class="s"  x="846" y="275" text-anchor="middle">and what was unsure</text>

  <rect class="store" x="392" y="316" rx="4" width="216" height="56"/>
  <text class="tb" x="500" y="338" text-anchor="middle">Kill switch</text>
  <text class="s"  x="500" y="356" text-anchor="middle">storage/STOP_AUTOMATION</text>

  <rect class="store" x="660" y="316" rx="4" width="248" height="56"/>
  <text class="tb" x="784" y="338" text-anchor="middle">Decision log (SQLite)</text>
  <text class="s"  x="784" y="356" text-anchor="middle">one row per ticket, reconciled</text>

  <rect class="store" x="398" y="404" rx="4" width="204" height="56"/>
  <text class="tb" x="500" y="426" text-anchor="middle">29 reviewed articles</text>
  <text class="s"  x="500" y="444" text-anchor="middle">indexed as 59 passages</text>

  <path class="flow" d="M 122 197 L 154 197"/>
  <path class="flow" d="M 270 197 L 302 197"/>
  <path class="flow" d="M 418 197 L 450 197"/>
  <path class="flow" d="M 566 197 L 598 197"/>
  <path class="flow" d="M 658 150 L 658 122"/>
  <path class="flow" d="M 714 79 L 758 79"/>
  <path class="flow" d="M 846 118 L 846 146"/>
  <path class="flow" d="M 714 234 L 758 248"/>
  <path class="flow" d="M 930 90 C 962 90 962 254 934 254"/>
  <path class="flowl" d="M 500 316 L 616 248"/>
  <path class="flowl" d="M 690 246 L 742 318"/>
  <path class="flowl" d="M 500 404 L 500 238"/>

  <text class="lbl" x="664" y="138" text-anchor="start">auto_respond</text>
  <text class="lbl" x="742" y="262" text-anchor="start">escalate</text>
  <text class="lbl" x="936" y="172" text-anchor="start">blocked</text>
  <text class="lbl" x="528" y="286" text-anchor="start">halt</text>
  <text class="lbl" x="700" y="296" text-anchor="start">every decision</text>
  <text class="lbl" x="508" y="392" text-anchor="start">indexed once, on first search</text>
</svg>
